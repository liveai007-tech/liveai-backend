        value: postgresql://postgres:liveai%40007y%40S4@db.yktacumecmbwgkdgztip.supabase.co:5432/postgres?sslmode=require
      - key: JWT_SECRET
        value: LiveAiFreeSecret2025
      - key: ENCRYPTION_MASTER_KEY
        value: dummy
      - key: PHONE_HMAC_SECRET
        value: dummy
